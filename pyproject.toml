[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asymptotic"
version = "0.2.0"
description = "Symbolic asymptotics, transseries, dominant balance, and certified remainders on SymPy"
requires-python = ">=3.11"
dependencies = ["sympy>=1.14", "exprtest>=0.1.0", "funcprops>=0.3.0", "semialg>=1.3.1"]
readme = "README.md"
authors = [{name = "Bhuvanesh Bhatt", email = "bhuvaneshbhatt@gmail.com"}]
license = "GPL-3.0-only"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Mathematics",
]
keywords = [
    "asymptotics",
    "symbolic mathematics",
    "computer algebra",
    "sympy",
    "limits",
    "multivariate limits",
    "series expansions",
    "asymptotic expansions",
    "asymptotic analysis",
    "special functions",
    "differential equations",
    "recurrence relations",
    "singularity analysis",
    "formal series",
    "symbolic computation",
]

[project.urls]
Repository = "https://github.com/BhuvaneshBhatt/asymptotic"
Documentation = "https://github.com/BhuvaneshBhatt/asymptotic/tree/main/docs"
Issues = "https://github.com/BhuvaneshBhatt/asymptotic/issues"
Changelog = "https://github.com/BhuvaneshBhatt/asymptotic/blob/main/CHANGELOG.md"

[project.optional-dependencies]
flint = ["python-flint>=0.9.0"]
optimization = ["symbopt>=0.1.0"]
ode = ["odeanalysis>=0.1.0"]
test = ["pytest>=8", "hypothesis>=6"]
release = ["build>=1", "twine>=5"]
benchmark = ["pytest>=8", "pytest-benchmark>=4"]
lint = ["ruff>=0.16"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q -p no:ddtrace"

[tool.setuptools.package-data]
asymptotic = ["py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B023", "BLE"]
