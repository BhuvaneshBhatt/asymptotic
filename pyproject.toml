[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asymptotic"
version = "0.1.0"
description = "Symbolic asymptotics, transseries, dominant balance, and certified remainders on SymPy"
requires-python = ">=3.10"
dependencies = ["sympy>=1.12", "exprtest>=0.1.0"]
readme = "README.md"
authors = [{name = "Bhuvanesh Bhatt", email = "bhuvaneshbhatt@gmail.com"}]
license = "GPL-3.0-only"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Homepage = "https://github.com/BhuvaneshBhatt/asymptotic"
Repository = "https://github.com/BhuvaneshBhatt/asymptotic"
Issues = "https://github.com/BhuvaneshBhatt/asymptotic/issues"
Documentation = "https://github.com/BhuvaneshBhatt/asymptotic/tree/main/docs"

[project.optional-dependencies]
flint = ["python-flint>=0.6"]
ode = ["odeanalysis>=0.1.0"]
release = ["build>=1", "twine>=5"]
test = [
    "pytest>=8",
    "hypothesis>=6",
    "tomli>=2; python_version < '3.11'",
]
benchmark = [
    "pytest>=8",
    "pytest-benchmark>=4",
    "tomli>=2; python_version < '3.11'",
]
lint = ["ruff>=0.16"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["asymptotic*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q -p no:ddtrace"

[tool.setuptools.package-data]
asymptotic = ["py.typed"]

[tool.ruff]
line-length = 100
exclude = [
    "notebooks",
    ".git",
    ".venv",
    "build",
    "dist",
]
