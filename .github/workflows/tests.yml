name: tests

on:
  push:
  pull_request:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -U pip
      - run: python -m pip install -e ".[test,lint]"
      - run: ruff check src tests benchmarks tools examples
      - run: python -m compileall -q src tests benchmarks tools examples
      - run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 pytest --collect-only -q

  shards:
    needs: static
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        shard:
          - contracts
          - core-algebra
          - series-calculus
          - transseries
          - algebraic
          - relations-properties
          - multivariate
          - differential
          - discrete
          - probability-saddles
          - statistics
          - remainders-certificates
          - invariants-properties
          - reference-docs
          - performance-cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -U pip
      - run: python -m pip install -e ".[test]"
      - run: python tools/run_test_shard.py "${{ matrix.shard }}"

  wheel:
    needs: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -U pip build
      - run: python -m pip install -e ".[test]"
      - run: python -m build --wheel
      - run: ASYMPTOTIC_WHEEL="$(find dist -name '*.whl' -print -quit)" PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 pytest -q tests/test_installed_wheel.py

  optional-backends:
    needs: static
    strategy:
      fail-fast: false
      matrix:
        extra: ["flint", "ode"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -U pip
      - run: python -m pip install -e ".[test,${{ matrix.extra }}]"
      - run: python tools/run_test_shard.py contracts
      - run: python tools/run_test_shard.py differential

  all-tests:
    if: always()
    needs: [static, shards, wheel, optional-backends]
    runs-on: ubuntu-latest
    steps:
      - name: Require every release gate
        env:
          STATIC: ${{ needs.static.result }}
          SHARDS: ${{ needs.shards.result }}
          WHEEL: ${{ needs.wheel.result }}
          OPTIONAL: ${{ needs.optional-backends.result }}
        run: |
          test "$STATIC" = success
          test "$SHARDS" = success
          test "$WHEEL" = success
          test "$OPTIONAL" = success
