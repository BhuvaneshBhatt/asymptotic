name: publish-to-pypi

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -U pip
      - run: python -m pip install -e ".[test,lint]"
      - run: ruff check src tests benchmarks tools examples
      - run: python -m compileall -q src tests benchmarks tools examples
      - run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 pytest --collect-only -q
      - name: Require tag to match package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import tomllib

          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          expected = f"v{version}"
          actual = os.environ["RELEASE_TAG"]
          if actual != expected:
              raise SystemExit(f"release tag {actual!r} does not match {expected!r}")
          PY

  shards:
    needs: static
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        shard:
          - contracts
          - core-algebra
          - series-calculus
          - transseries
          - algebraic
          - relations-properties
          - multivariate
          - differential
          - discrete
          - probability-saddles
          - statistics
          - remainders-certificates
          - invariants-properties
          - reference-docs
          - performance-cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -U pip
      - run: python -m pip install -e ".[test]"
      - run: python tools/run_test_shard.py "${{ matrix.shard }}"

  build:
    needs: [static, shards]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -U pip build twine
      - run: python -m pip install -e ".[test]"
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Test the built wheel in a clean target
        run: |
          ASYMPTOTIC_WHEEL="$(find dist -name '*.whl' -print -quit)" \
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 \
          pytest -q tests/test_installed_wheel.py
      - uses: actions/upload-artifact@v4
        with:
          name: pypi-distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/asymptotic
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pypi-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
